<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap"
  rel="stylesheet"
/>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spinner Shop</title>
    <link rel="stylesheet" href="Estyle.css" />
  </head>
  <body>
    <section class="hero">
      <div class="hero-content">
        <h2>brian's shop</h2>
      </div>
    </section>
    <h1>spin me baby one more time</h1>
    <div class="clock-container">
      <div id="clock">00:00:00</div>
    </div>
    <div class="main-layout">
      <aside class="sidebar">
        <h3>filter products</h3>
        <button class="filter-btn active" data-filter="all">
          all products
        </button>
        <button class="filter-btn" data-filter="Plastic">plastic</button>
        <button class="filter-btn" data-filter="Metal">metal</button>
        <button class="filter-btn" data-filter="Glow">glow</button>
        <button class="filter-btn" data-filter="Novelty">novelty</button>
        <h3>Shopping Music</h3>
        <audio controls>
          <source src="Christmas.mp3" type="audio/mpeg" />
          Your browser does not support the audio element.
        </audio>
        <div class="cart">
          <h1>Cart</h1>
          <p></p>
        </div>
      </aside>
      <div class="container"></div>
    </div>
    <script src="Ecommerce.js"></script>
  </body>
</html>
